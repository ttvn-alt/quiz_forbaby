<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแบบทดสอบทางการพยาบาล</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }

        .clean-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }

        .option-card {
            transition: all 0.15s ease-in-out;
        }

        .option-card:hover {
            border-color: #3b82f6;
            background-color: #f8fafc;
        }

        .option-card.selected {
            border-color: #2563eb !important;
            background-color: #eff6ff !important;
        }

        .correct-ans {
            background-color: #f0fdf4 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
            font-weight: 600;
        }

        .wrong-ans {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
            text-decoration: line-through;
        }

        .explanation {
            background-color: #f1f5f9;
            border-left: 4px solid #0284c7;
            border-radius: 0.5rem;
            display: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="p-4 md:p-8 pb-16 antialiased">

<div class="max-w-3xl mx-auto">
    <!-- Header -->
    <header class="mb-8 text-center border-b border-slate-200 pb-6">
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight mb-2">
            ระบบแบบทดสอบทางการพยาบาล
        </h1>
        <p class="text-slate-500 text-sm md:text-base">
            แบบทดสอบวิชาการพยาบาลพื้นฐาน กฎหมายวิชาชีพ และจุลชีววิทยา
        </p>
    </header>

    <!-- Setup Section -->
    <div id="setup-section" class="clean-card p-6 md:p-8">
        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
            <h2 class="text-lg font-bold text-slate-800">
                เลือกแบบทดสอบ
            </h2>
            <button onclick="toggleSummaryModal()" class="text-sm font-medium text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
                📖 สรุปเนื้อหากฎหมาย
            </button>
        </div>

        <div class="space-y-5 mb-6">
            <!-- Subject Selection -->
            <div>
                <label class="block text-slate-700 font-semibold mb-2 text-sm">
                    วิชา:
                </label>
                <select id="subject-select" onchange="updateSubjectTheme()" class="w-full bg-white border border-slate-300 rounded-lg p-3 text-sm font-medium text-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition cursor-pointer">
                    <option value="funda" selected>การพยาบาลพื้นฐาน (Fundamental Nursing)</option>
                    <option value="law">กฎหมายทั่วไปและการพยาบาล (General & Nursing Law)</option>
                    <option value="micro">จุลชีววิทยาประยุกต์คลินิก (Microbiology)</option>
                </select>
                <p id="subject-desc" class="text-xs text-slate-500 mt-1.5">
                    ข้อสอบการพยาบาลก่อน-หลังผ่าตัด การให้สารน้ำ/เลือด การบริหารยา การสวนปัสสาวะ และการควบคุมการติดเชื้อ
                </p>
            </div>

            <!-- Level Selection -->
            <div>
                <label class="block text-slate-700 font-semibold mb-2 text-sm">
                    ระดับความยาก:
                </label>
                <select id="level-select" class="w-full bg-white border border-slate-300 rounded-lg p-3 text-sm font-medium text-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition cursor-pointer">
                    <option value="all" selected>ทุกระดับความยาก (Combined)</option>
                    <option value="easy">ระดับง่าย (Easy)</option>
                    <option value="medium">ระดับปานกลาง (Medium)</option>
                    <option value="hard">ระดับยาก (Hard)</option>
                    <option value="expert">ระดับยากมาก (Expert)</option>
                </select>
            </div>

            <!-- Options -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">ตัวเลือกเพิ่มเติม</div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <label class="flex items-center gap-2.5 bg-white p-2.5 rounded-lg border border-slate-200 cursor-pointer text-sm font-medium text-slate-700">
                        <input type="checkbox" id="random-questions" checked class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                        <span>สุ่มข้อสอบ</span>
                    </label>
                    <label class="flex items-center gap-2.5 bg-white p-2.5 rounded-lg border border-slate-200 cursor-pointer text-sm font-medium text-slate-700">
                        <input type="checkbox" id="random-options" checked class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                        <span>สุ่มตัวเลือก</span>
                    </label>
                    <div class="flex items-center gap-2 bg-white p-2 rounded-lg border border-slate-200 text-sm">
                        <span class="text-xs font-medium text-slate-500 shrink-0">จำนวน:</span>
                        <select id="question-count-select" class="w-full bg-slate-50 font-medium text-slate-700 rounded p-1 text-sm outline-none">
                            <option value="10">10 ข้อ</option>
                            <option value="20" selected>20 ข้อ</option>
                            <option value="30">30 ข้อ</option>
                            <option value="all">ทั้งหมด</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="startQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg text-base transition shadow-sm">
            เริ่มทำแบบทดสอบ
        </button>
    </div>

    <!-- Quiz Section -->
    <div id="quiz-section" class="hidden clean-card p-6 md:p-8">
        <!-- Progress Bar & Status -->
        <div class="mb-6 border-b border-slate-100 pb-4">
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-2">
                    <span id="subject-badge" class="bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded text-xs font-semibold"></span>
                    <span id="level-badge" class="bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded text-xs font-semibold"></span>
                </div>
                <span id="progress-text" class="text-xs font-medium text-slate-500">0 / 0</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-200" style="width: 0%;"></div>
            </div>
        </div>

        <div id="questions-container"></div>

        <button id="submit-btn" onclick="submitQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg text-base transition shadow-sm mt-6">
            ส่งคำตอบ
        </button>

        <div id="result-box" class="mt-6 text-center p-6 rounded-xl hidden"></div>

        <div id="action-buttons" class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-6 hidden">
            <button onclick="restartQuizWithSameSettings()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
                ทำอีกครั้ง (สุ่มใหม่)
            </button>
            <button onclick="resetSetup()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 rounded-lg text-sm transition">
                เลือกแบบทดสอบอื่น
            </button>
        </div>
    </div>
</div>

<!-- Legal Summary Modal -->
<div id="summary-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white text-slate-800 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-slate-900 text-white p-5 flex justify-between items-center">
            <h3 class="text-lg font-bold">สรุปเนื้อหากฎหมายสำคัญ</h3>
            <button onclick="toggleSummaryModal()" class="text-slate-400 hover:text-white text-xl font-bold w-8 h-8 flex items-center justify-center rounded-lg">
                ✕
            </button>
        </div>
        <div id="summary-modal-content" class="p-6 overflow-y-auto space-y-5 text-sm leading-relaxed">
            <!-- Rendered by JS -->
        </div>
        <div class="bg-slate-50 p-4 border-t border-slate-100 text-right">
            <button onclick="toggleSummaryModal()" class="bg-slate-800 hover:bg-slate-900 text-white font-medium px-5 py-2 rounded-lg text-sm transition">
                ปิดหน้าต่าง
            </button>
        </div>
    </div>
</div>

<script src="question.js"></script>

<script>
    let currentQuestions = [];
    let userAnswers = [];

    function updateSubjectTheme() {
        const subject = document.getElementById('subject-select').value;
        const desc = document.getElementById('subject-desc');
        if (subject === 'funda') {
            desc.innerHTML = 'ข้อสอบการพยาบาลก่อน-หลังผ่าตัด การให้สารน้ำ/เลือด การบริหารยา การสวนปัสสาวะ และการควบคุมการติดเชื้อ';
        } else if (subject === 'law') {
            desc.innerHTML = 'ข้อสอบกฎหมายแพ่ง-อาญา พ.ร.บ. วิชาชีพการพยาบาลฯ พ.ร.บ. สุขภาพแห่งชาติ และข้อบังคับสภาการพยาบาล';
        } else {
            desc.innerHTML = 'ข้อสอบจุลชีววิทยาคลินิก แบคทีเรีย ไวรัส เชื้อรา การทำลายเชื้อ ยาปฏิชีวนะ และวัคซีน';
        }
    }

    function toggleSummaryModal() {
        const modal = document.getElementById('summary-modal');
        modal.classList.toggle('hidden');
        if (!modal.classList.contains('hidden')) {
            renderLegalSummary();
        }
    }

    function renderLegalSummary() {
        const container = document.getElementById('summary-modal-content');
        if (typeof lawSummaryData === 'undefined') {
            container.innerHTML = '<p class="text-red-500">ไม่พบข้อมูลสรุปกฎหมาย</p>';
            return;
        }
        let html = '';
        lawSummaryData.forEach(item => {
            html += `
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-3">
                        <h4 class="font-bold text-slate-900">${item.title}</h4>
                        <span class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded font-medium">${item.badge}</span>
                    </div>
                    <ul class="space-y-2 text-slate-700">
                        ${item.points.map(p => `<li class="flex items-start gap-2"><span class="text-slate-400 font-bold">•</span><div class="leading-relaxed">${p}</div></li>`).join('')}
                    </ul>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function startQuiz() {
        if (typeof quizData === 'undefined') {
            alert("ไม่สามารถโหลดฐานข้อมูลข้อสอบได้");
            return;
        }

        const subject = document.getElementById('subject-select').value;
        const level = document.getElementById('level-select').value;
        const isRandomQ = document.getElementById('random-questions').checked;
        const isRandomOpt = document.getElementById('random-options').checked;
        const countChoice = document.getElementById('question-count-select').value;

        let sourcePool = [];
        const subjData = quizData[subject] || quizData;

        if (level === 'all') {
            ['easy', 'medium', 'hard', 'expert'].forEach(lvl => {
                if (subjData[lvl]) {
                    sourcePool = sourcePool.concat(subjData[lvl]);
                }
            });
        } else {
            if (subjData[level]) {
                sourcePool = subjData[level];
            }
        }

        if (!sourcePool || sourcePool.length === 0) {
            alert("ไม่พบข้อสอบในหมวดนี้");
            return;
        }

        let processedPool = JSON.parse(JSON.stringify(sourcePool));

        if (isRandomQ) {
            shuffleArray(processedPool);
        }

        if (countChoice !== 'all') {
            const num = parseInt(countChoice, 10);
            if (!isNaN(num) && num > 0) {
                processedPool = processedPool.slice(0, num);
            }
        }

        if (isRandomOpt) {
            processedPool.forEach(qObj => {
                const correctText = qObj.options[qObj.ans];
                shuffleArray(qObj.options);
                qObj.ans = qObj.options.indexOf(correctText);
            });
        }

        currentQuestions = processedPool;
        userAnswers = new Array(currentQuestions.length).fill(null);

        let subjectText = 'การพยาบาลพื้นฐาน';
        if (subject === 'law') subjectText = 'กฎหมายทั่วไปและการพยาบาล';
        else if (subject === 'micro') subjectText = 'จุลชีววิทยา';

        const levelSelect = document.getElementById('level-select');
        const levelText = levelSelect.options[levelSelect.selectedIndex].text;

        document.getElementById('subject-badge').innerText = subjectText;
        document.getElementById('level-badge').innerText = `${levelText} (${currentQuestions.length} ข้อ)`;

        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('result-box').classList.add('hidden');
        document.getElementById('action-buttons').classList.add('hidden');

        updateProgressBar();
        renderQuestions();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        const labels = ['ก', 'ข', 'ค', 'ง'];

        currentQuestions.forEach((qObj, qIndex) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'bg-white p-5 md:p-6 rounded-xl mb-5 border border-slate-200';

            let optionsHTML = '';
            qObj.options.forEach((opt, oIndex) => {
                const optionLabel = labels[oIndex] || `${oIndex + 1}`;
                optionsHTML += `
                    <label id="label-q${qIndex}-o${oIndex}" class="option-card flex items-start p-3.5 mb-2.5 bg-white border border-slate-200 rounded-lg cursor-pointer transition">
                        <input type="radio" name="q${qIndex}" value="${oIndex}" class="mt-0.5 mr-3 w-4 h-4 accent-blue-600 cursor-pointer" onchange="selectAnswer(${qIndex}, ${oIndex})">
                        <div class="flex gap-2 text-sm text-slate-800 leading-relaxed">
                            <span class="font-semibold text-blue-600 shrink-0">${optionLabel}.</span>
                            <span>${opt}</span>
                        </div>
                    </label>
                `;
            });

            qDiv.innerHTML = `
                <div class="flex items-start gap-2.5 mb-4">
                    <span class="bg-slate-100 text-slate-700 font-bold px-2.5 py-0.5 rounded text-xs shrink-0 mt-0.5">ข้อ ${qIndex + 1}</span>
                    <h3 class="text-base md:text-lg font-bold text-slate-900 leading-relaxed">${qObj.q}</h3>
                </div>
                <div class="options-container">${optionsHTML}</div>
                <div id="expl-q${qIndex}" class="explanation p-4 mt-3 text-sm">
                    <strong class="text-slate-800 font-semibold block mb-1">💡 เฉลยและเหตุผล:</strong>
                    <div class="text-slate-700 leading-relaxed">${qObj.reason}</div>
                </div>
            `;
            container.appendChild(qDiv);
        });
    }

    function selectAnswer(qIndex, oIndex) {
        userAnswers[qIndex] = oIndex;

        const qOptions = currentQuestions[qIndex].options;
        qOptions.forEach((_, idx) => {
            const lbl = document.getElementById(`label-q${qIndex}-o${idx}`);
            if (lbl) {
                if (idx === oIndex) {
                    lbl.classList.add('selected');
                } else {
                    lbl.classList.remove('selected');
                }
            }
        });

        updateProgressBar();
    }

    function updateProgressBar() {
        const answeredCount = userAnswers.filter(a => a !== null).length;
        const total = currentQuestions.length;
        const percent = total > 0 ? Math.round((answeredCount / total) * 100) : 0;

        document.getElementById('progress-text').innerText = `${answeredCount} / ${total} ข้อ`;
        document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    function submitQuiz() {
        const unanswered = userAnswers.map((a, idx) => a === null ? idx + 1 : null).filter(a => a !== null);

        if (unanswered.length > 0) {
            alert(`กรุณาตอบคำถามให้ครบทุกข้อก่อนส่งครับ (ยังไม่ได้ตอบข้อ: ${unanswered.join(', ')})`);
            return;
        }

        let score = 0;

        currentQuestions.forEach((qObj, qIndex) => {
            const selected = userAnswers[qIndex];
            const correct = qObj.ans;

            const radios = document.getElementsByName(`q${qIndex}`);
            radios.forEach(radio => radio.disabled = true);

            qObj.options.forEach((_, oIdx) => {
                const lbl = document.getElementById(`label-q${qIndex}-o${oIdx}`);
                if (lbl) lbl.classList.remove('selected');
            });

            if (selected === correct) {
                score++;
                const correctLbl = document.getElementById(`label-q${qIndex}-o${selected}`);
                if (correctLbl) correctLbl.classList.add('correct-ans');
            } else {
                const wrongLbl = document.getElementById(`label-q${qIndex}-o${selected}`);
                const correctLbl = document.getElementById(`label-q${qIndex}-o${correct}`);
                if (wrongLbl) wrongLbl.classList.add('wrong-ans');
                if (correctLbl) correctLbl.classList.add('correct-ans');
            }

            const explBox = document.getElementById(`expl-q${qIndex}`);
            if (explBox) explBox.style.display = 'block';
        });

        document.getElementById('submit-btn').classList.add('hidden');

        const resultBox = document.getElementById('result-box');
        resultBox.classList.remove('hidden');
        document.getElementById('action-buttons').classList.remove('hidden');

        const total = currentQuestions.length;
        const percentage = Math.round((score / total) * 100);

        let msg = "";
        let badgeColor = "";

        if (percentage >= 80) {
            msg = "ทำคะแนนได้ดีมาก คุณมีความเข้าใจในเนื้อหาวิชานี้เป็นอย่างดี";
            badgeColor = "bg-green-50 border border-green-200 text-green-800";
        } else if (percentage >= 50) {
            msg = "ผ่านเกณฑ์การทดสอบ แนะนำให้ทบทวนข้อที่ผิดเพิ่มเติมเพื่อความแม่นยำ";
            badgeColor = "bg-amber-50 border border-amber-200 text-amber-800";
        } else {
            msg = "ลองอ่านทบทวนเฉลยคำอธิบายในข้อที่ผิดเพื่อเสริมความเข้าใจให้ดียิ่งขึ้น";
            badgeColor = "bg-slate-100 border border-slate-200 text-slate-800";
        }

        resultBox.className = `mt-6 text-center p-6 rounded-xl font-bold ${badgeColor}`;
        resultBox.innerHTML = `
            <div class="text-3xl font-extrabold mb-1">คะแนนของคุณ: ${score} / ${total}</div>
            <div class="text-sm font-semibold mb-2">คิดเป็น ${percentage}%</div>
            <div class="text-sm font-normal text-slate-600 max-w-md mx-auto">${msg}</div>
        `;

        resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function restartQuizWithSameSettings() {
        startQuiz();
    }

    function resetSetup() {
        document.getElementById('setup-section').classList.remove('hidden');
        document.getElementById('quiz-section').classList.add('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
